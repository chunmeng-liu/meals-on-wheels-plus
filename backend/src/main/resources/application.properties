server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealsplus}
spring.datasource.username=${DB_USERNAME:mealsplus}
spring.datasource.password=${DB_PASSWORD:mealsplus}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:local-only-secret-not-valid-for-production-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.demo.enabled=${DEMO_SEED_ENABLED:true}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@mealsplus.local}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin123!}
app.demo.senior-email=${DEMO_SENIOR_EMAIL:senior@mealsplus.local}
app.demo.senior-password=${DEMO_SENIOR_PASSWORD:Senior123!}
app.demo.volunteer-email=${DEMO_VOLUNTEER_EMAIL:volunteer@mealsplus.local}
app.demo.volunteer-password=${DEMO_VOLUNTEER_PASSWORD:Volunteer123!}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.jpa.open-in-view=false
server.error.include-message=never
