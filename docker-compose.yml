services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mealsplus
      POSTGRES_USER: mealsplus
      POSTGRES_PASSWORD: mealsplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealsplus -d mealsplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mealsplus
      DB_USERNAME: mealsplus
      DB_PASSWORD: mealsplus
      JWT_SECRET: local-docker-secret-change-before-deploying-12345
      DEMO_SEED_ENABLED: "true"
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
